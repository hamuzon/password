# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      GA_MEASUREMENT_ID: G-F8HVYVW05H
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 'main'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Inject analytics and hostname normalization
        run: |
          : "${GA_MEASUREMENT_ID:?GA_MEASUREMENT_ID is empty}"
          case "$GA_MEASUREMENT_ID" in
            G-[A-Z0-9]*) ;;
            *) echo "Invalid GA_MEASUREMENT_ID: $GA_MEASUREMENT_ID" >&2; exit 1 ;;
          esac

          snippet=$(mktemp)
          trap 'rm -f "$snippet"' EXIT

          find . -type f -name "*.html" -not -name "google*.html" -not -path "./.git/*" -print0 |
            while IFS= read -r -d '' file; do
              : > "$snippet"

              if ! grep -qi "googletagmanager.com/gtag/js" "$file"; then
                printf '%s\n' \
                  '<!-- Google tag (gtag.js) -->' \
                  "<script async src=\"https://www.googletagmanager.com/gtag/js?id=${GA_MEASUREMENT_ID}\"></script>" \
                  '<script>' \
                  'window.dataLayer = window.dataLayer || [];' \
                  'function gtag(){dataLayer.push(arguments);}' \
                  'gtag("js", new Date());' \
                  "gtag(\"config\", \"${GA_MEASUREMENT_ID}\");" \
                  '</script>' >> "$snippet"
              fi

              if ! grep -qi 'hostname.endsWith(".")' "$file"; then
                printf '%s\n' \
                  '<script>if(location.hostname.endsWith(".")){const url=new URL(location.href);url.hostname=url.hostname.slice(0,-1);location.replace(url.href);}</script>' \
                  >> "$snippet"
              fi

              if [ ! -s "$snippet" ]; then
                continue
              fi

              if ! grep -qi '<head[[:space:]>]' "$file"; then
                echo "No <head> tag found in $file" >&2
                exit 1
              fi

              INJECT_SNIPPET="$(cat "$snippet")" perl -0pi -e \
                's{(<head\b[^>]*>)}{$1 . "\n" . $ENV{INJECT_SNIPPET}}ie or die "Failed to inject scripts into HTML\n"' \
                "$file"
              echo "Injected scripts into $file"
            done

      - name: Remove sensitive files from deployment artifact
        run: |
          # デプロイ対象から削除
          rm -rf functions README.md README readme.md license LICENSE LICENSE.txt _redirects.md _redirects

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
