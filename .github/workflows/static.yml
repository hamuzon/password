
# Simple workflow for deploying static content to Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 'main'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Inject scripts into HTML
        env:
          GA_MEASUREMENT_ID: G-F8HVYVW05H
        run: |
          set -e

          : "${GA_MEASUREMENT_ID:?GA_MEASUREMENT_ID is empty}"

          find . -type f -name "*.html" ! -iname "google*.html" -print0 |
          while IFS= read -r -d '' file; do
            if grep -qi 'googletagmanager.com/gtag/js' "$file" &&
               grep -q 'window.location.hostname.endsWith' "$file"; then
              echo "SKIP: $file"
              continue
            fi

            if ! grep -qi '<head[[:space:]>]' "$file"; then
              echo "SKIP: $file (No head)"
              continue
            fi

            GA_MEASUREMENT_ID="$GA_MEASUREMENT_ID" perl -0777 -i -pe '
              BEGIN {
                $ga_id = $ENV{"GA_MEASUREMENT_ID"};
                $ga = qq{<!-- Google tag (gtag.js) -->
          <script async src="https://www.googletagmanager.com/gtag/js?id=$ga_id"></script>
          <script>
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag("js", new Date());
          gtag("config", "$ga_id");
          </script>};

                $fqdn = q{<script>
          if (window.location.hostname.endsWith(".")) {
            window.location.replace(window.location.href.replace(window.location.hostname, window.location.hostname.slice(0, -1)));
          }
          </script>};
              }

              s{(<head\b[^>]*>)}{
                $head = $1;
                $scripts = "";

                $scripts .= "\n$ga\n" unless /googletagmanager\.com\/gtag\/js/i;
                $scripts .= "\n$fqdn\n" unless /window\.location\.hostname\.endsWith/;

                "$head$scripts"
              }ise;
            ' "$file"

            echo "PROCESSED: $file"
          done

      - name: Remove sensitive files from deployment artifact
        run: |
          rm -rf functions README.md README readme.md license LICENSE LICENSE.txt _redirects.md _redirects

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
